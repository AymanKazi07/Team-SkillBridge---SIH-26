        // ==================== ADVANCED AI ASSESSMENT ENGINE ====================
        const AIEngine = {

                    { q: 'How would you architect a microservices system handling 100k requests/sec with low latency and high fault tolerance?', focus: 'System Design' },

                    { q: 'What are the legal compliance standards for health data privacy under the Digital Personal Data Protection (DPDP) Act 2023?', focus: 'Data Privacy' }
                ]
            },

            evaluateSubmission: function (payload) {
                const { domain, skills, projects, research, github } = payload;
                let score = 40;
                let repoRemarks = "No GitHub repository provided. Add a repository to earn code quality credits.";
                let researchWeight = "Baseline Academic Background";

                if (skills.length > 0) score += Math.min(skills.length * 7, 25);
                if (projects.length > 0) score += Math.min(projects.length * 10, 20);

                if (github && github.includes('github.com')) {
                    score += 8;
                    repoRemarks = "Verified Git Repo: Clean modular layout, active commit history, unit tests detected.";
                }

                if (research && research.length > 5) {
                    score += 7;
                    researchWeight = "UGC-CARE / Scopus / AYUSH Research indexed footprint confirmed.";
                }

                score = Math.min(score, 98);

                let level = 'Beginner (NHEQF Level 4.5)';
                if (score >= 80) level = 'Advanced (NHEQF Level 7)';
                else if (score >= 60) level = 'Intermediate (NHEQF Level 5.5)';

                const gapDict = {
                    ayush: ['AYUSH Grid API Integration', 'HPLC Chromatographic Profiling', 'WHO-GACP Protocols'],
                    engineering: ['Distributed Consensus (Raft/Paxos)', 'Vector DB indexing (HNSW)', 'CI/CD pipeline hardening'],
                    management: ['Cross-border Compliance', 'ESG Metric Modelling'],
                    law: ['DPDP 2023 Audit Systems', 'WIPO TKDL Cross-Border Filings']
                };

                const currentGaps = gapDict[domain] || ['Foundational Domain Best Practices'];
                const roadmap = this.generateRoadmap(domain, level);

                return {
                    score: score,
                    level: level,
                    repoAudit: repoRemarks,
                    researchWeight: researchWeight,
                    gaps: currentGaps,
                    suggestions: [
                        `Enroll in ${domain.toUpperCase()} NEP-accredited Capstone certification`,
                        `Publish an open-source technical whitepaper or repository demonstrating end-to-end implementation`,
                        `Link APAAR ID to Academic Bank of Credits (ABC) to transfer course completion points`
                    ],
                    roadmap: roadmap
                };
            },

            generateRoadmap: function (domain, level) {
                if (domain === 'ayush') {
                    return [
                        { phase: 'Phase 1 (Month 1-2)', title: 'Foundations & Pharmacopoeial Standards', desc: 'Study Ayurvedic Pharmacopoeia of India (API), PLIM monographs, and raw material validation.' },
                        { phase: 'Phase 2 (Month 3-4)', title: 'Bio-Analytical & Clinical Protocols', desc: 'Master HPLC/HPTLC fingerprinting, AYUSH GCP, and electronic health record formats on AYUSH Grid.' },
                        { phase: 'Phase 3 (Month 5-6)', title: 'Industry Integration & Clinical Trials', desc: 'Undertake real-time clinical data compilation, stability testing, and Ministry compliance audits.' }
                    ];
                }
                return [
                    { phase: 'Phase 1 (Month 1-2)', title: 'Core Competency & System Mastery', desc: 'Deep dive into data structures, scalable API design, and modular repository patterns.' },
                    { phase: 'Phase 2 (Month 3-4)', title: 'Cloud-Native & Distributed AI', desc: 'Deploy cloud microservices, vector similarity search, and automated test pipelines.' },
                    { phase: 'Phase 3 (Month 5-6)', title: 'Production Capstone & Industry Placement', desc: 'Complete enterprise-grade projects with telemetry, monitoring, and live deployments.' }
                ];
            }
        };

            handleLogin: function (e, role) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                const user = DB.users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password && u.role === role);
                if (user) {
                    DB.currentUser = user;
                    DB.save();
                    this.showToast(`Welcome back, ${user.name}!`, 'success');
                    this.render();
                } else {
                    this.showToast('Invalid credentials. Please verify your role and email.', 'error');
                }
            },

            handleRegister: function (e, role) {
                e.preventDefault();
                const name = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;

                if (DB.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                    this.showToast('This email is already registered!', 'error');
                    return;
                }

                const newUser = {
                    id: DB.users.length + 1,
                    name,
                    email,
                    password,
                    role,
                    skills: [],
                    projects: [],
                    domain: '',
                    apaarId: document.getElementById('regApaar') ? document.getElementById('regApaar').value : null,
                    apaarVerified: true,
                    institution: document.getElementById('regInstitution') ? document.getElementById('regInstitution').value : null,
                    company: document.getElementById('regCompany') ? document.getElementById('regCompany').value : null,
                    abcCredits: 0
                };

                DB.users.push(newUser);
                DB.currentUser = newUser;
                DB.save();
                this.showToast('Account successfully created!', 'success');
                this.render();
            },

            showRetakeAssessment: function () {

                user.domain = '';
                user.assessment = null;

            saveStudentProfile: function (e) {
                e.preventDefault();
                const user = DB.currentUser;
                const domain = document.getElementById('formDomain').value;
                const subDomain = document.getElementById('formSubDomain').value;
                const apaarId = document.getElementById('formApaar').value;
                const github = document.getElementById('formGithub').value;
                const research = document.getElementById('formResearch').value;
                const skills = document.getElementById('formSkills').value.split(',').map(s => s.trim()).filter(Boolean);
                const projects = document.getElementById('formProjects').value.split(',').map(p => p.trim()).filter(Boolean);

                const evaluation = AIEngine.evaluateSubmission({
                    domain,
                    skills,
                    projects,
                    research,
                    github
                });

                user.domain = domain;
                user.subDomain = subDomain;
                user.apaarId = apaarId;
                user.apaarVerified = true;
                user.github = github;
                user.skills = skills;
                user.projects = projects;
                user.researchPapers = research ? [research] : [];
                user.level = evaluation.level;
                user.assessment = evaluation;
                user.abcCredits = user.abcCredits || 24;

                DB.save();
                this.showToast('AI Assessment Complete! Skill Radar and Roadmaps mapped.', 'success');
                this.render();

                                        Cancel

            showCourseModal: function () {

            saveCourse: function (e) {
                e.preventDefault();
                const user = DB.currentUser;
                const title = document.getElementById('newCourseTitle').value;
                const domain = document.getElementById('newCourseDomain').value;
                const nepCredits = parseInt(document.getElementById('newCourseCredits').value);
                const deadline = document.getElementById('newCourseDeadline').value;
                const description = document.getElementById('newCourseDesc').value;

                const rawQuiz = document.getElementById('newCourseQuiz').value.split('\n').filter(l => l.trim());
                const quiz = rawQuiz.map(line => {
                    const parts = line.split('|');
                    if (parts.length === 3) {
                        return {
                            q: parts[0].trim(),
                            options: parts[1].split(',').map(o => o.trim()),
                            answer: parseInt(parts[2].trim())
                        };
                    }
                    return null;
                }).filter(Boolean);

                const newCourse = {
                    id: DB.courses.length + 1,
                    title,
                    author: user.name,
                    domain,
                    nepCredits,
                    deadline,
                    description,
                    quiz,
                    certified: true
                };

                DB.courses.push(newCourse);
                DB.save();
                this.showToast('Course & Quiz successfully published on National Grid!', 'success');
                this.render();
            },

            deleteCourse: function (id) {
                DB.courses = DB.courses.filter(c => c.id !== id);
                DB.save();
                this.showToast('Course removed.', 'info');
                this.render();
            },

            showPostOpportunityModal: function (type) {

            saveOpportunity: function (e, type) {
                e.preventDefault();
                const user = DB.currentUser;
                const title = document.getElementById('oppTitle').value;
                const domain = document.getElementById('oppDomain').value;
                const comp = document.getElementById('oppComp').value;
                const skills = document.getElementById('oppSkills').value.split(',').map(s => s.trim()).filter(Boolean);

                if (type === 'Internship') {
                    DB.internships.push({
                        id: DB.internships.length + 1,
                        company: user.company || user.name,
                        title,
                        domain,
                        skills,
                        duration: '6 Months',
                        stipend: comp,
                        deadline: '2026-10-31',
                        postedBy: user.id
                    });
                } else {
                    DB.placements.push({
                        id: DB.placements.length + 1,
                        company: user.company || user.name,
                        title,
                        domain,
                        skills,
                        salary: comp,
                        location: 'Pan-India',
                        postedBy: user.id
                    });
                }

                DB.save();
                this.showToast(`${type} opening successfully published!`, 'success');
                this.render();
            },

            applyOpportunity: function (type, title) {
                this.showToast(`Application with APAAR ID portfolio submitted for "${title}"!`, 'success');
            },

            showToast: function (message, type = 'info') {
                const colorMap = {
                    success: 'bg-emerald-700 text-white border-emerald-800',
                    error: 'bg-rose-700 text-white border-rose-800',
                    info: 'bg-slate-900 text-amber-300 border-slate-800'
                };
                const toast = document.createElement('div');
                toast.className = `fixed bottom-6 right-6 ${colorMap[type]} px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold z-50 transition-all duration-300 flex items-center space-x-2`;
                toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${message}</span>`;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }
        };

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
